name: Release

# Push a tag like v0.1.0-alpha.1 (matching apps/desktop/package.json, with a section in
# CHANGELOG.md) to build installers for macOS, Windows and Linux. The result is a DRAFT release:
# check it, then publish it on GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            args: ""
            rust-targets: ""
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The release notes: this version's section of CHANGELOG.md ("## [0.1.0-alpha.1] - …").
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then echo "::error::CHANGELOG.md has no section for $version"; exit 1; fi
          { echo "body<<KNYC_NOTES"; echo "$notes"; echo "KNYC_NOTES"; } >> "$GITHUB_OUTPUT"
      # RPM refuses "-" in a version ("0.1.0-alpha.1"); Linux packages write a pre-release with "~"
      # ("0.1.0~alpha.1", which also sorts before 0.1.0). Tauri merges this file on Linux only.
      - name: Linux package version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node -e 'const v = require("./apps/desktop/package.json").version.replace(/-/g, "~");
            require("fs").writeFileSync("apps/desktop/src-tauri/tauri.linux.conf.json", JSON.stringify({ version: v }) + "\n")'
          cat apps/desktop/src-tauri/tauri.linux.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: KnYC ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  stable-names:
    name: Add stable asset names
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      # The landing page links to releases/latest/download/<stable name>, so every release
      # carries copies of its installers under version-free names, plus SHA256SUMS.
      - name: Download, rename, upload
        run: |
          mkdir assets stable && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          cp *universal.dmg            ../stable/KnYC-macos-universal.dmg
          cp *x64-setup.exe            ../stable/KnYC-windows-x64-setup.exe
          cp *x64_en-US.msi            ../stable/KnYC-windows-x64.msi
          cp *amd64.AppImage           ../stable/KnYC-linux-x86_64.AppImage
          cp *amd64.deb                ../stable/KnYC-linux-amd64.deb
          cp *x86_64.rpm               ../stable/KnYC-linux-x86_64.rpm
          cd ../stable
          sha256sum KnYC-* > SHA256SUMS
          gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"

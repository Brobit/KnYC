server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS, read at each request: nginx starts even when the API isn't there (a lone web
  # container answers its pages; /api answers 502 until the API is up).
  resolver 127.0.0.11 valid=10s;
  set $api http://api:3000;

  location /api/ {
    proxy_pass $api;
  }

  location / {
    try_files $uri /index.html;
  }
}

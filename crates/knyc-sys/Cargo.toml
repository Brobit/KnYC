[package]
name = "knyc-sys"
version = "0.1.0-alpha.1"
license = "GPL-3.0-only"
publish = false
description = "KnYC system CLI: intake, scan, graph and run, as JSON (used by the TypeScript pipeline)."
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
knyc-analyzer = { path = "../knyc-analyzer" }
knyc-runner = { path = "../knyc-runner" }
serde = "1.0.229"
serde_json = "1.0.154"
